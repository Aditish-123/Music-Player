<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="player">

        <h1>🎵 Mini Music Player</h1>

        <div class="album">
            🎧
        </div>

        <h2 id="songTitle">My Favorite Song</h2>
        <p id="artist">Demo Artist</p>

        <div class="progress-container">
            <input type="range" id="progress" value="0">
        </div>

        <div class="controls">
            <button onclick="previousSong()">⏮</button>
            <button id="playBtn" onclick="togglePlay()">▶️</button>
            <button onclick="nextSong()">⏭</button>
        </div>

        <div class="volume">
            🔊
            <input type="range" id="volume" min="0" max="100" value="70">
        </div>

        <p id="status">Paused</p>

    </div>

    <script src="script.js"></script>

</body>
</html>
